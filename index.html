<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MaliSafari | E-Rickshaw Booking</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7f5;
  color: #17201b;
}

header {
  background: #087a45;
  color: white;
  text-align: center;
  padding: 28px 15px;
}

header h1 {
  margin: 0;
  font-size: 34px;
}

header p {
  margin: 8px 0 0;
  font-size: 16px;
}

.container {
  max-width: 520px;
  margin: 25px auto;
  padding: 0 15px;
}

.card {
  background: white;
  padding: 24px;
  border-radius: 18px;
  box-shadow: 0 5px 25px rgba(0,0,0,.08);
}

h2 {
  margin-top: 0;
}

label {
  display: block;
  font-weight: bold;
  margin-top: 17px;
  margin-bottom: 7px;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #ccd5cf;
  border-radius: 10px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 22px;
  background: #087a45;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 17px;
  font-weight: bold;
}

button:disabled {
  opacity: .6;
}

.message {
  margin-top: 15px;
  padding: 13px;
  border-radius: 10px;
  display: none;
}

.success {
  display: block;
  background: #e8f7ee;
  color: #087a45;
}

.error {
  display: block;
  background: #ffeaea;
  color: #a30000;
}

footer {
  text-align: center;
  color: #66736c;
  padding: 25px;
  font-size: 13px;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
</head>

<body>

<header>
  <h1>🛺 MaliSafari</h1>
  <p>Easy E-Rickshaw Booking in Biratnagar</p>
</header>

<div class="container">

<div class="card">

<h2>Book Your Ride</h2>

<p>Enter your details and request a MaliSafari e-rickshaw.</p>

<form id="bookingForm">

<label>Your Name</label>
<input id="passengerName" required>

<label>Phone Number</label>
<input id="passengerPhone" type="tel" inputmode="tel" required>

<label>Pickup Point</label>
<input id="pickup" required>

<label>Destination</label>
<input id="destination" required>

<button id="bookingButton" type="submit">
Request MaliSafari
</button>

</form>

<div id="message" class="message"></div>

</div>
</div>

<footer>
MaliSafari • Biratnagar, Nepal
</footer>

<script>

const supabaseClient = supabase.createClient(
  MALISAFARI_SUPABASE_URL,
  MALISAFARI_SUPABASE_KEY
);

const form = document.getElementById("bookingForm");
const button = document.getElementById("bookingButton");
const message = document.getElementById("message");

form.addEventListener("submit", async function(event) {

  event.preventDefault();

  button.disabled = true;
  button.textContent = "Booking...";

  message.className = "message";
  message.textContent = "";

  const booking = {
    passenger_name: document.getElementById("passengerName").value.trim(),
    passenger_phone: document.getElementById("passengerPhone").value.trim(),
    pickup: document.getElementById("pickup").value.trim(),
    destination: document.getElementById("destination").value.trim(),
    status: "pending"
  };

  const { error } = await supabaseClient
    .from("bookings")
    .insert([booking]);

  if (error) {

    console.error(error);

    message.className = "message error";
    message.textContent =
      "Booking could not be submitted. Please try again.";

  } else {

    message.className = "message success";
    message.textContent =
      "Booking successful! MaliSafari will contact you shortly.";

    form.reset();
  }

  button.disabled = false;
  button.textContent = "Request MaliSafari";

});

</script>

</body>
</html>
