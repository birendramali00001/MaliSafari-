
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MaliSafari Driver Portal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f7f4;color:#203128}
header{background:#087a45;color:white;text-align:center;padding:22px}
header h1{margin:0}
main{max-width:750px;margin:20px auto;padding:0 14px}
.card{background:white;padding:20px;border-radius:14px;margin-bottom:16px;box-shadow:0 3px 15px #0001}
input,select,button{width:100%;padding:13px;margin:7px 0;border-radius:8px;font-size:16px}
input,select{border:1px solid #ccd5cf;background:white}
button{background:#087a45;color:white;border:0;font-weight:bold;cursor:pointer}
button.secondary{background:#e6eee8;color:#087a45}
button:disabled{opacity:.55;cursor:wait}
.hidden{display:none!important}
.muted{color:#68776d;font-size:14px;line-height:1.5}
.message{padding:12px;border-radius:8px;margin-bottom:14px;overflow-wrap:anywhere;background:#e7f2e9}
.ride{border:1px solid #dbe4dc;padding:15px;border-radius:10px;margin:12px 0}
.ride p{overflow-wrap:anywhere;line-height:1.45}
.status{font-weight:bold;color:#087a45}
footer{text-align:center;padding:20px;color:#68776d}
</style>
</head>
<body>

<header>
<h1>🛺 MaliSafari</h1>
<p>Driver Portal</p>
</header>

<main>
<div id="message" class="message hidden" role="status"></div>

<section id="authCard" class="card">
<h2 id="authTitle">Driver Login</h2>
<p class="muted">
Log in with your email and password. Your email must be registered
by the admin, and your driver account must be approved before you
can access rides.
</p>

<form id="authForm">
<input id="email" type="email" placeholder="Email address"
autocomplete="email" required>
<input id="password" type="password"
placeholder="Password (minimum 6 characters)"
minlength="6" autocomplete="current-password" required>
<button id="submitBtn" type="submit">Login</button>
</form>

<button id="registerBtn" class="secondary" type="button">Create Driver Account</button>
<button id="forgotBtn" class="secondary" type="button">Forgot Password?</button>
</section>

<section id="dashboard" class="hidden">
<div class="card">
<h2>My Dashboard</h2>
<p id="accountEmail" class="muted"></p>
<button id="refreshBtn" class="secondary" type="button">Refresh My Rides</button>
<button id="logoutBtn" type="button">Logout</button>
</div>

<div class="card">
<h2>My Assigned Rides</h2>
<div id="rides">Loading rides...</div>
</div>
</section>
</main>

<footer>MaliSafari · Biratnagar, Nepal</footer>

<script>
const SUPABASE_URL = "https://mtblgpkirgwytiylenrg.supabase.co";
const SUPABASE_KEY = "sb_publishable_fW5mkTBuEKJVXc7_3Olv4w_uRA5aQ90";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);

let registering = false;
let busy = false;

function showMessage(text) {
  $("message").textContent = text;
  $("message").classList.remove("hidden");
}
function clearMessage() {
  $("message").textContent = "";
  $("message").classList.add("hidden");
}
function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#039;"
  }[ch]));
}
function formatTime(value) {
  if (!value) return "Not recorded";
  const d = new Date(value);
  return Number.isNaN(d.getTime()) ? "Not recorded" : d.toLocaleString();
}
function setBusy(value) {
  busy = value;
  document.querySelectorAll("button").forEach(b => b.disabled = value);
}
function showLogin() {
  $("authCard").classList.remove("hidden");
  $("dashboard").classList.add("hidden");
}
function showDashboard(user) {
  $("authCard").classList.add("hidden");
  $("dashboard").classList.remove("hidden");
  $("accountEmail").textContent = user.email || "";
}

async function enterPortal() {
  const {data:{user}, error:userError} = await db.auth.getUser();
  if (userError || !user) {
    showLogin();
    return;
  }

  const {data, error} = await db.rpc("driver_claim_account");
  if (error) {
    console.error(error);
    showLogin();
    showMessage("Driver setup is incomplete. Please contact the admin.");
    return;
  }

  if (!data || data.approved !== true) {
    showLogin();
    showMessage(
      data && data.registered === false
        ? "Your email is not registered in the admin's driver list. Please contact the admin."
        : "Your driver account is awaiting admin approval."
    );
    return;
  }

  showDashboard(user);
  await loadRides();
}

$("authForm").addEventListener("submit", async event => {
  event.preventDefault();
  if (busy) return;
  clearMessage();
  setBusy(true);

  try {
    const email = $("email").value.trim().toLowerCase();
    const password = $("password").value;

    if (registering) {
      const {data, error} = await db.auth.signUp({
        email,
        password,
        options: { emailRedirectTo: window.location.href.split("#")[0] }
      });
      if (error) throw error;

      if (data.session) {
        await enterPortal();
      } else {
        showMessage("Registration submitted. Check your email to confirm the account. Admin approval is required.");
      }
    } else {
      const {error} = await db.auth.signInWithPassword({email, password});
      if (error) throw error;
      await enterPortal();
    }
  } catch (error) {
    console.error(error);
    showMessage(error.message || "Login or registration failed.");
  } finally {
    setBusy(false);
  }
});

$("registerBtn").addEventListener("click", () => {
  registering = !registering;
  $("authTitle").textContent = registering ? "Create Driver Account" : "Driver Login";
  $("submitBtn").textContent = registering ? "Register" : "Login";
  $("password").autocomplete = registering ? "new-password" : "current-password";
  $("registerBtn").textContent = registering ? "Back to Login" : "Create Driver Account";
  clearMessage();
});

$("forgotBtn").addEventListener("click", async () => {
  if (busy) return;
  const email = $("email").value.trim().toLowerCase();

  if (!email) {
    showMessage("Enter your email address first.");
    return;
  }

  setBusy(true);
  try {
    const {error} = await db.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.href.split("#")[0]
    });
    if (error) throw error;
    showMessage("If the email is registered, a password reset link will be sent.");
  } catch (error) {
    showMessage(error.message || "Password reset failed.");
  } finally {
    setBusy(false);
  }
});

$("logoutBtn").addEventListener("click", async () => {
  if (busy) return;
  setBusy(true);
  try {
    const {error} = await db.auth.signOut();
    if (error) throw error;
    $("rides").innerHTML = "";
    showLogin();
    showMessage("You have logged out.");
  } catch (error) {
    showMessage(error.message || "Logout failed.");
  } finally {
    setBusy(false);
  }
});

$("refreshBtn").addEventListener("click", loadRides);

async function loadRides() {
  $("rides").textContent = "Loading assigned rides...";

  const {data, error} = await db.rpc("driver_get_bookings");
  if (error) {
    console.error(error);
    $("rides").textContent = "";
    showMessage("Could not load rides. Please check your connection or contact the admin.");
    return;
  }

  const rows = Array.isArray(data) ? data : [];
  if (!rows.length) {
    $("rides").innerHTML = '<p class="muted">No assigned rides yet.</p>';
    return;
  }

  $("rides").innerHTML = rows.map(r => {
    const id = escapeHTML(r.booking_id);
    const started = !!r.pickup_time;
    const completed = !!r.completed_at;
    const method = String(r.payment_method || "").toLowerCase();
    const payment = String(r.payment_status || "pending").toLowerCase();
    const paid = payment === "collected" || payment === "verified";

    let actions = "";

    if (!started && !completed) {
      actions += '<button data-act="start" data-id="' + id + '">Confirm Passenger Pickup</button>';
    } else if (started && !completed && !paid) {
      if (!method) {
        actions +=
          '<label for="pay-' + id + '">Payment method for this ride</label>' +
          '<select id="pay-' + id + '">' +
          '<option value="cash">Cash</option>' +
          '<option value="esewa">eSewa</option>' +
          '</select>' +
          '<button data-act="payment" data-id="' + id + '">Record Payment</button>';
      } else if (method === "cash") {
        actions += '<button data-act="payment" data-id="' + id + '" data-method="cash">Confirm Cash Collected</button>';
      } else if (method === "esewa") {
        actions += '<p class="muted">eSewa payment must be reported and verified by the admin before this ride can be completed.</p>' +
          '<button data-act="payment" data-id="' + id + '" data-method="esewa">Report eSewa Payment</button>';
      } else {
        actions += '<p class="muted">Unknown payment method. Contact the admin.</p>';
      }
    } else if (started && !completed && paid) {
      actions += '<button data-act="complete" data-id="' + id + '">Complete Ride</button>';
    } else if (completed) {
      actions += '<p class="status">Ride completed.</p>';
    }

    if (started && !completed && method === "esewa" && payment === "pending") {
      actions += '<p class="muted">Ride completion will be available after admin verification of eSewa payment.</p>';
    }

    return '<article class="ride">' +
      '<p><b>Booking ID:</b> ' + id + '</p>' +
      '<p><b>Passenger:</b> ' + escapeHTML(r.passenger_name) + '</p>' +
      '<p><b>Phone:</b> ' + escapeHTML(r.passenger_phone) + '</p>' +
      '<p><b>Pickup:</b> ' + escapeHTML(r.pickup) + '</p>' +
      '<p><b>Destination:</b> ' + escapeHTML(r.destination) + '</p>' +
      '<p><b>Fare:</b> Rs. ' + escapeHTML(r.fare) + '</p>' +
      '<p><b>Ride status:</b> <span class="status">' + escapeHTML(r.status) + '</span></p>' +
      '<p><b>Pickup time:</b> ' + escapeHTML(formatTime(r.pickup_time)) + '</p>' +
      '<p><b>Completion time:</b> ' + escapeHTML(formatTime(r.completed_at)) + '</p>' +
      '<p><b>Payment method:</b> ' + escapeHTML(method || "Not selected") + '</p>' +
      '<p><b>Payment status:</b> ' + escapeHTML(payment) + '</p>' +
      actions +
      '</article>';
  }).join("");
}

$("rides").addEventListener("click", async event => {
  const button = event.target.closest("button[data-act]");
  if (!button || busy) return;

  const id = button.dataset.id;
  const action = button.dataset.act;
  clearMessage();
  setBusy(true);

  try {
    let result;

    if (action === "start") {
      result = await db.rpc("driver_start_ride", { p_booking_id: id });
    } else if (action === "complete") {
      result = await db.rpc("driver_complete_ride", { p_booking_id: id });
    } else if (action === "payment") {
      const method = button.dataset.method || $("pay-" + id)?.value;
      if (!method) throw new Error("Please select a payment method.");
      result = await db.rpc("driver_record_payment", {
        p_booking_id: id,
        p_payment_method: method
      });
    }

    if (result.error) throw result.error;
    if (result.data === false) {
      throw new Error("This action was not accepted. Check the ride assignment, payment status, and driver approval.");
    }

    showMessage(
      action === "start" ? "Passenger pickup recorded." :
      action === "complete" ? "Ride completed successfully." :
      button.dataset.method === "esewa" ? "eSewa payment report submitted. The admin must verify payment before ride completion." :
      "Payment action recorded."
    );

    await loadRides();
  } catch (error) {
    console.error(error);
    showMessage(error.message || "Could not update the ride.");
  } finally {
    setBusy(false);
  }
});

(async () => {
  const {data:{session}} = await db.auth.getSession();
  if (session) await enterPortal();
})();
</script>
</body>
</html>
