<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MaliSafari Admin Login</title>

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    defer>
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-box {
      background: white;
      width: 100%;
      max-width: 400px;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.12);
    }

    h1 {
      text-align: center;
      margin: 0 0 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      min-height: 20px;
      line-height: 1.5;
      color: #d00;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h1>🛺 MaliSafari</h1>

    <div class="subtitle">
      Admin Login
    </div>

    <form id="loginForm">

      <label for="email">Admin Email</label>

      <input
        type="email"
        id="email"
        placeholder="Enter admin email"
        autocomplete="username"
        required
      >

      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        placeholder="Enter password"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="loginButton">
        Login
      </button>

      <div id="message"></div>

    </form>

  </div>

  <script>

    window.addEventListener("load", async function () {

      const form =
        document.getElementById("loginForm");

      const button =
        document.getElementById("loginButton");

      const message =
        document.getElementById("message");


      function showMessage(text, color) {
        message.textContent = text;
        message.style.color = color || "#d00";
      }


      // ------------------------------------------
      // WAIT FOR SUPABASE
      // ------------------------------------------

      if (!window.supabase) {

        showMessage(
          "Supabase is not loading. Please refresh the page.",
          "#d00"
        );

        return;
      }


      // ------------------------------------------
      // SUPABASE CONNECTION
      // ------------------------------------------

      const SUPABASE_URL =
        "https://mtblgpkirgwytiylenrg.supabase.co";

      const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_fW5mkTBuEKJVXc7_3Olv4w_uRA5aQ90";


      let supabaseClient;

      try {

        supabaseClient =
          window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
          );

      } catch (error) {

        showMessage(
          "Supabase setup error: " + error.message,
          "#d00"
        );

        return;
      }


      // ------------------------------------------
      // LOGIN
      // ------------------------------------------

      form.addEventListener(
        "submit",
        async function (event) {

          event.preventDefault();
          event.stopPropagation();


          const email =
            document.getElementById("email")
              .value
              .trim();

          const password =
            document.getElementById("password")
              .value;


          if (!email || !password) {

            showMessage(
              "Please enter your email and password.",
              "#d00"
            );

            return;
          }


          button.disabled = true;
          button.textContent = "Logging in...";

          showMessage(
            "Logging in...",
            "#555"
          );


          try {

            const {
              data,
              error
            } =
              await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
              });


            if (error) {

              showMessage(
                "Login failed: " + error.message,
                "#d00"
              );

              button.disabled = false;
              button.textContent = "Login";

              return;
            }


            if (!data || !data.session) {

              showMessage(
                "Login failed: No session was created.",
                "#d00"
              );

              button.disabled = false;
              button.textContent = "Login";

              return;
            }


            showMessage(
              "Login successful. Opening dashboard...",
              "green"
            );


            setTimeout(function () {

              window.location.href =
                "admin-dashboard.html";

            }, 700);

          } catch (error) {

            showMessage(
              "Login error: " + error.message,
              "#d00"
            );

            button.disabled = false;
            button.textContent = "Login";

          }

        }
      );

    });

  </script>

</body>
</html>
