<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MaliSafari Admin Login</title>

<style>

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7f5;
}

.login-box {
  width: calc(100% - 30px);
  max-width: 400px;
  margin: 80px auto;
  background: white;
  padding: 25px;
  border-radius: 18px;
  box-shadow: 0 5px 25px rgba(0,0,0,.1);
}

h1 {
  text-align: center;
  color: #087a45;
}

input {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  box-sizing: border-box;
  border: 1px solid #ccd5cf;
  border-radius: 9px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 18px;
  background: #087a45;
  color: white;
  border: 0;
  border-radius: 9px;
  font-size: 16px;
  font-weight: bold;
}

#error {
  color: #b00000;
  margin-top: 12px;
}

</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

</head>

<body>

<div class="login-box">

<h1>🔐 MaliSafari</h1>

<p>Admin Login</p>

<input
  id="email"
  type="email"
  placeholder="Admin email"
>

<input
  id="password"
  type="password"
  placeholder="Password"
>

<button id="loginButton">
Login
</button>

<div id="error"></div>

</div>

<script>

const db = supabase.createClient(
  MALISAFARI_SUPABASE_URL,
  MALISAFARI_SUPABASE_KEY
);

document
.getElementById("loginButton")
.addEventListener("click", async function() {

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const errorBox = document.getElementById("error");

  errorBox.textContent = "";

  if (!email || !password) {
    errorBox.textContent = "Enter email and password.";
    return;
  }

  const { error } = await db.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {

    errorBox.textContent = error.message;

  } else {

    window.location.href = "admin-dashboard.html";

  }

});

</script>

</body>
</html>
