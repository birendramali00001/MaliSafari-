<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MaliSafari Admin Dashboard</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7f5;
  color: #17201b;
}

header {
  background: #087a45;
  color: white;
  padding: 20px;
}

header h1 {
  margin: 0;
}

main {
  max-width: 1200px;
  margin: 20px auto;
  padding: 0 15px;
}

.controls {
  display: flex;
  gap: 10px;
  margin-bottom: 15px;
}

.controls button {
  padding: 11px 16px;
  border: 0;
  border-radius: 8px;
  cursor: pointer;
}

.refresh {
  background: #087a45;
  color: white;
}

.logout {
  background: #333;
  color: white;
}

.table-container {
  background: white;
  border-radius: 15px;
  overflow-x: auto;
  box-shadow: 0 3px 15px rgba(0,0,0,.06);
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 850px;
}

th,
td {
  padding: 13px;
  border-bottom: 1px solid #eee;
  text-align: left;
}

th {
  background: #f0f4f1;
}

select {
  padding: 7px;
  border-radius: 7px;
  border: 1px solid #ccd5cf;
}

.empty {
  text-align: center;
  padding: 30px;
  color: #68756e;
}

@media(max-width:600px) {

  header h1 {
    font-size: 22px;
  }

}

</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

</head>

<body>

<header>

<h1>🛺 MaliSafari Admin Dashboard</h1>

</header>

<main>

<div class="controls">

<button class="refresh" onclick="loadBookings()">
🔄 Refresh
</button>

<button class="logout" onclick="logout()">
Logout
</button>

</div>

<div class="table-container">

<table>

<thead>

<tr>
<th>Time</th>
<th>Passenger</th>
<th>Phone</th>
<th>Pickup</th>
<th>Destination</th>
<th>Fare</th>
<th>Status</th>
</tr>

</thead>

<tbody id="bookingRows">

<tr>
<td colspan="7" class="empty">
Loading bookings...
</td>
</tr>

</tbody>

</table>

</div>

</main>

<script>

const db = supabase.createClient(
  MALISAFARI_SUPABASE_URL,
  MALISAFARI_SUPABASE_KEY
);


async function checkLogin() {

  const { data, error } = await db.auth.getSession();

  if (error || !data.session) {

    window.location.href = "admin.html";
    return;

  }

  loadBookings();

}


async function loadBookings() {

  const rows = document.getElementById("bookingRows");

  rows.innerHTML = `
    <tr>
      <td colspan="7" class="empty">
        Loading...
      </td>
    </tr>
  `;

  const { data, error } = await db
    .from("bookings")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {

    console.error("Load bookings error:", error);

    rows.innerHTML = `
      <tr>
        <td colspan="7" class="empty">
          Could not load bookings.
        </td>
      </tr>
    `;

    return;
  }

  if (!data || data.length === 0) {

    rows.innerHTML = `
      <tr>
        <td colspan="7" class="empty">
          No bookings yet.
        </td>
      </tr>
    `;

    return;

  }


  rows.innerHTML = data.map(function(booking) {

    const statuses = [
      "pending",
      "accepted",
      "completed",
      "cancelled"
    ];

    const options = statuses.map(function(status) {

      return `
        <option
          value="${status}"
          ${booking.status === status ? "selected" : ""}
        >
          ${status}
        </option>
      `;

    }).join("");


    return `
      <tr>

        <td>
          ${new Date(booking.created_at).toLocaleString()}
        </td>

        <td>
          ${escapeHTML(booking.passenger_name)}
        </td>

        <td>
          ${escapeHTML(booking.passenger_phone)}
        </td>

        <td>
          ${escapeHTML(booking.pickup)}
        </td>

        <td>
          ${escapeHTML(booking.destination)}
        </td>

        <td>
          ${booking.fare ?? "—"}
        </td>

        <td>

          <select
            onchange="updateStatus(
              '${escapeJS(booking.created_at)}',
              '${escapeJS(booking.passenger_phone)}',
              this.value
            )"
          >

            ${options}

          </select>

        </td>

      </tr>
    `;

  }).join("");

}


async function updateStatus(createdAt, phone, status) {

  const { data, error } = await db
    .from("bookings")
    .update({
      status: status
    })
    .eq("created_at", createdAt)
    .eq("passenger_phone", phone)
    .select();

  if (error) {

    console.error("Supabase update error:", error);

    alert(
      "Could not update booking status.\n\n" +
      "Message: " + (error.message || "Unknown error") +
      "\n\nCode: " + (error.code || "N/A") +
      "\n\nDetails: " + (error.details || "N/A")
    );

    return;

  }

  if (!data || data.length === 0) {

    alert(
      "No booking was updated.\n\n" +
      "Please refresh the dashboard and try again."
    );

    return;

  }

  alert("Booking status updated successfully!");

}


async function logout() {

  await db.auth.signOut();

  window.location.href = "admin.html";

}


function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function escapeJS(value) {

  return String(value ?? "")
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'")
    .replace(/\r/g, "\\r")
    .replace(/\n/g, "\\n");

}


checkLogin();

</script>

</body>

</html>
